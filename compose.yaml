services:
  saludvital:
    build:
      context: .
      target: final
    container_name: saludvital
    image: saludvital:dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/salud"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
